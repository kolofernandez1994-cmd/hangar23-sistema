<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>HANGAR23 — Tomar pedido</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#0a0a0a;--surface:#141414;--surface2:#1d1d1d;--surface3:#272727;--border:#323232;--accent:#ffdb59;--accent2:#f0c000;--text:#f8f8f8;--muted:#a7a7a7;--danger:#ff6262;--success:#58e894;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--app-h:100dvh}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{background:var(--bg);color-scheme:dark;min-height:100%;overscroll-behavior:none}
    body{min-height:var(--app-h);background:var(--bg);color:var(--text);font-family:'DM Sans',Arial,sans-serif;overflow:hidden;-webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
    button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .app{height:var(--app-h);display:flex;flex-direction:column;padding-top:var(--safe-top)}
    .topbar{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:rgba(20,20,20,.96);border-bottom:1px solid var(--border);z-index:10}
    .logo,.head-title,.sheet-title,.order-client,.metric-value{font-family:'Bebas Neue','Arial Narrow',sans-serif;font-weight:400;color:#fff;-webkit-text-fill-color:#fff;-webkit-font-smoothing:antialiased;letter-spacing:1px}
    .logo{font-size:27px;color:var(--accent);-webkit-text-fill-color:var(--accent);letter-spacing:2px}.today{font:11px/1.2 'DM Mono',monospace;color:var(--muted);text-align:right}.today b{display:block;color:var(--success);font-size:15px;margin-top:2px}
    main{position:relative;flex:1;min-height:0}.view{position:absolute;inset:0;display:none;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:14px 14px calc(105px + var(--safe-bottom))}.view.active{display:block}
    .chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 1px 14px}.chips::-webkit-scrollbar{display:none}.chip{flex:none;white-space:nowrap;border:1px solid var(--border);border-radius:99px;background:var(--surface2);padding:9px 15px;color:#ddd;font-size:13px;font-weight:600}.chip.active{background:var(--accent);border-color:var(--accent);color:#111}
    .products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product{min-height:125px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px 12px;transition:transform .12s,background .12s}.product:active{transform:scale(.98);background:var(--surface2);border-color:var(--accent)}.type,.label{font:10px 'DM Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.55px}.product-name{margin:7px 0;font-family:'Bebas Neue','Arial Narrow',sans-serif;font-size:23px;font-weight:400;line-height:1.04;letter-spacing:.55px;color:#fff!important;-webkit-text-fill-color:#fff!important;-webkit-font-smoothing:antialiased}.price{font:600 16px 'DM Mono',monospace;color:var(--accent)}
    .tabbar{height:65px;flex:none;display:flex;background:rgba(20,20,20,.98);border-top:1px solid var(--border);padding-bottom:var(--safe-bottom);z-index:20}.tab{flex:1;background:none;color:var(--muted);font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.tab .icon{font-size:20px;line-height:1}.tab.active{color:var(--accent)}
    .cartbar{position:fixed;z-index:19;left:10px;right:10px;bottom:calc(73px + var(--safe-bottom));display:none;align-items:center;justify-content:space-between;background:var(--accent);color:#101010;border-radius:15px;padding:12px 16px;box-shadow:0 9px 28px rgba(0,0,0,.46);font-weight:700}.cartbar.show{display:flex}.cart-info{font-size:13px}.cart-info small{display:block;opacity:.72;font:11px 'DM Mono',monospace;margin-top:2px}.cart-total{font:700 15px 'DM Mono',monospace}
    .empty{text-align:center;color:var(--muted);font-size:13px;padding:52px 18px}.empty .emoji{font-size:38px;display:block;margin-bottom:10px}
    .overlay{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.62);align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:min(88dvh,760px);overflow-y:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:16px 18px calc(24px + var(--safe-bottom));animation:up .2s ease-out}.handle{width:38px;height:4px;border-radius:5px;background:#454545;margin:0 auto 15px}.sheet-title{font-size:29px}.sub{font-size:12px;color:var(--muted);margin:3px 0 16px}.stepper{display:flex;justify-content:center;align-items:center;gap:18px;margin:14px 0 20px}.round,.mini,.remove,.close{background:var(--surface2);border:1px solid var(--border);color:#fff}.round{width:50px;height:50px;border-radius:13px;font-size:24px;font-weight:700}.step-value{min-width:42px;text-align:center;font:36px 'Bebas Neue',sans-serif;color:#fff;-webkit-text-fill-color:#fff}.extras{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 18px}.extra{border:1px solid var(--border);border-radius:99px;padding:9px 12px;background:var(--surface2);font-size:13px;color:#f6f6f6}.extra.on{color:var(--accent);border-color:var(--accent);background:rgba(255,219,89,.1)}.extra em{font:11px 'DM Mono',monospace;font-style:normal;opacity:.75}.primary,.secondary,.danger,.print{width:100%;border-radius:14px;padding:15px;font-size:15px;font-weight:700}.primary{background:var(--accent);color:#111}.secondary{background:var(--surface2);border:1px solid var(--border);color:#fff}.danger{color:var(--danger);background:transparent;border:1px solid rgba(255,98,98,.38)}.print{background:#315dd7;color:#fff}.primary:disabled{opacity:.45}
    .full{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;background:var(--bg);padding-top:var(--safe-top)}.full.open{display:flex}.full-head{height:65px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);flex:none}.head-title{font-size:27px;flex:1}.close{width:38px;height:38px;border-radius:50%;font-size:17px}.full-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;padding:16px}.full-foot{flex:none;background:var(--surface);border-top:1px solid var(--border);padding:13px 16px calc(14px + var(--safe-bottom))}
    .line{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}.line-info{flex:1;min-width:0}.line-name{font-size:14px;font-weight:700;color:#fff;-webkit-text-fill-color:#fff}.line-extras{font-size:11px;color:var(--muted);margin-top:3px}.mini-step{display:flex;align-items:center;gap:8px;margin-top:8px}.mini{width:27px;height:27px;border-radius:7px;font-size:15px}.mini-step span{font:13px 'DM Mono',monospace;min-width:15px;text-align:center}.line-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}.remove{width:32px;height:32px;border-radius:50%;color:var(--danger)}.total-row{display:flex;justify-content:space-between;padding:16px 0;font:28px 'Bebas Neue',sans-serif;letter-spacing:1px;color:#fff;-webkit-text-fill-color:#fff}.total-row b{color:var(--accent);-webkit-text-fill-color:var(--accent)}.divider{border:0;border-top:1px solid var(--border);margin:0 0 16px}.field{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:12px;color:#fff;-webkit-text-fill-color:#fff;padding:13px 14px;margin:7px 0 15px;font-size:16px}.field::placeholder{color:#969696;opacity:1}.pay-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:7px 0 15px}.pay{border:1px solid var(--border);border-radius:11px;background:var(--surface2);color:#eee;padding:12px 8px;font-size:13px;font-weight:600}.pay.on{border-color:var(--accent);color:var(--accent);background:rgba(255,219,89,.1)}
    .order,.metric{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:14px;margin-bottom:12px}.order-top{display:flex;justify-content:space-between;gap:10px;margin-bottom:9px}.order-client{font-size:21px}.order-time,.order-items{font-size:12px;color:var(--muted);line-height:1.6}.order-total{font:700 15px 'DM Mono',monospace;color:var(--accent);white-space:nowrap}.badge{display:inline-block;margin:9px 0;padding:3px 9px;border-radius:99px;background:rgba(100,150,255,.15);color:#8aafff;font:11px 'DM Mono',monospace}.actions{display:flex;gap:8px;margin-top:11px}.actions .print{flex:1;padding:11px;font-size:13px}.actions .danger{width:auto;padding:10px 15px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{margin-bottom:12px}.metric-value{font-size:35px;margin-top:5px}.green{color:var(--success);-webkit-text-fill-color:var(--success)}.yellow{color:var(--accent);-webkit-text-fill-color:var(--accent)}.alert{padding:10px 11px;border-radius:10px;margin-top:8px;font-size:12px}.alert.bad{color:var(--danger);background:rgba(255,98,98,.1)}.alert.ok{color:var(--success);background:rgba(88,232,148,.1)}
    .toast{position:fixed;z-index:99;top:calc(14px + var(--safe-top));left:50%;transform:translate(-50%,-15px);opacity:0;pointer-events:none;background:var(--accent);color:#111;border-radius:12px;padding:11px 17px;font-size:13px;font-weight:700;box-shadow:0 8px 24px #0008;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.confirmed{display:flex;flex:1;align-items:center;justify-content:center;text-align:center;flex-direction:column;padding:20px}.confirmed .check{font-size:55px}.confirmed .customer{font:30px 'Bebas Neue',sans-serif;color:#fff;-webkit-text-fill-color:#fff;margin-top:10px}.confirmed .amount{font:600 22px 'DM Mono',monospace;color:var(--accent);margin-top:6px}
    #print-area{display:none}@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}@media (min-width:640px){.app{max-width:560px;margin:auto;border-left:1px solid var(--border);border-right:1px solid var(--border)}.cartbar{left:max(10px,calc(50% - 270px));right:max(10px,calc(50% - 270px))}}@media print{@page{size:80mm auto;margin:0}body>*:not(#print-area){display:none!important}#print-area{display:block!important;width:80mm;padding:4mm 3mm;background:#fff!important;color:#000!important;font:12px monospace}.ticket{break-after:page;page-break-after:always}.ticket:last-child{break-after:auto;page-break-after:auto}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="logo">HANGAR23</div><div class="today">Hoy<b id="top-total">$0</b></div></header>
  <main>
    <section class="view active" id="view-pedir"><div class="chips" id="chips"></div><div class="products" id="products"></div></section>
    <section class="view" id="view-pedidos"><div id="orders"></div></section>
    <section class="view" id="view-resumen"><div class="metrics"><div class="metric"><div class="label">Vendido hoy</div><div class="metric-value green" id="sum-total">$0</div></div><div class="metric"><div class="label">Pedidos hoy</div><div class="metric-value yellow" id="sum-count">0</div></div></div><div class="metric"><div class="label">Más vendida hoy</div><div class="metric-value" style="font-size:25px" id="sum-top">—</div></div><div class="metric"><div class="label">Alertas de stock</div><div id="alerts"></div></div></section>
  </main>
  <button class="cartbar" id="cartbar" type="button"><span class="cart-info"><span id="cart-count">0 ítems</span><small>Tocá para ver el pedido</small></span><span class="cart-total" id="cart-total">$0 ›</span></button>
  <nav class="tabbar"><button class="tab active" data-view="pedir"><span class="icon">🍔</span>Pedir</button><button class="tab" data-view="pedidos"><span class="icon">📋</span>Pedidos</button><button class="tab" data-view="resumen"><span class="icon">📊</span>Resumen</button></nav>
</div>
<div class="toast" id="toast" role="status"></div><div id="print-area"></div>
<div class="overlay" id="product-sheet"><div class="sheet"><div class="handle"></div><div class="sheet-title" id="sheet-name">—</div><div class="sub" id="sheet-desc"></div><div class="stepper"><button class="round" id="qty-less" type="button">−</button><div class="step-value" id="qty">1</div><button class="round" id="qty-more" type="button">+</button></div><div class="label" id="extra-label">Extras</div><div class="extras" id="extras"></div><button class="primary" id="add-product" type="button">Agregar</button></div></div>
<section class="full" id="cart-screen"><header class="full-head"><div class="head-title">Tu pedido</div><button class="close" data-close="cart-screen" type="button">✕</button></header><div class="full-body"><div id="cart-lines"></div><div class="total-row"><span>Total</span><b id="checkout-total">$0</b></div><hr class="divider"><label class="label" for="customer">Cliente</label><input class="field" id="customer" autocomplete="name" placeholder="Nombre del cliente"><label class="label" for="address">Dirección de entrega</label><input class="field" id="address" autocomplete="street-address" placeholder="Calle, número, piso/depto"><div class="label">Método de pago</div><div class="pay-grid" id="payments"></div><label class="label" for="notes">Aclaraciones (imprime en cocina)</label><textarea class="field" id="notes" rows="2" placeholder="Sin cebolla, salsa aparte..."></textarea></div><footer class="full-foot"><button class="primary" id="confirm-order" type="button">✓ Confirmar pedido</button></footer></section>
<section class="full" id="confirmed-screen"><header class="full-head"><div class="head-title">Pedido confirmado</div><button class="close" data-close="confirmed-screen" type="button">✕</button></header><div class="confirmed"><div class="check">✅</div><div class="customer" id="confirmed-customer"></div><div class="amount" id="confirmed-total"></div></div><footer class="full-foot" style="display:grid;gap:10px"><button class="print" id="print-last" type="button">🖨️ Imprimir ticket</button><button class="secondary" data-close="confirmed-screen" type="button">Nuevo pedido</button></footer></section>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDYvEr5rbVjhYLX5sbqYh4pK9bDSOH1cyk',authDomain:'hangar23-v706.firebaseapp.com',projectId:'hangar23-v706',storageBucket:'hangar23-v706.firebasestorage.app',messagingSenderId:'1073514334115',appId:'1:1073514334115:web:22de1feb1e94127857bc16'};
const dbx=getFirestore(initializeApp(firebaseConfig));
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-AR'); const today=()=>new Date().toISOString().slice(0,10); const normal=s=>(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase();
const state={recetas:[],extras:[],stock:[],ventas:[],filter:'Todos',cart:[],pay:'Efectivo',product:null,qty:1,selected:new Set(),lastId:null};
function toast(text){const e=$('#toast');e.textContent=text;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}
function render(){renderChips();renderProducts();renderOrders();renderSummary();renderCartBar()}
for(const name of ['recetas','extras','stock','ventas'])onSnapshot(collection(dbx,name),snap=>{state[name]=snap.docs.map(d=>({id:d.id,...d.data()}));if(name==='ventas')state.ventas.sort((a,b)=>(a.creadoEn||0)-(b.creadoEn||0));render()});
function renderChips(){const types=['Todos',...new Set(state.recetas.map(x=>x.tipo).filter(Boolean))];$('#chips').innerHTML=types.map(t=>`<button class="chip ${t===state.filter?'active':''}" data-type="${esc(t)}" type="button">${esc(t)}</button>`).join('');$('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.filter=b.dataset.type;renderChips();renderProducts()})}
function renderProducts(){const a=state.recetas.filter(x=>state.filter==='Todos'||x.tipo===state.filter);$('#products').innerHTML=a.length?a.map(x=>`<button class="product" data-id="${x.id}" type="button"><span><span class="type">${esc(x.tipo)}</span><span class="product-name">${esc(x.nombre)}</span></span><span class="price">${fmt(x.precio)}</span></button>`).join(''):'<div class="empty" style="grid-column:1/-1"><span class="emoji">🍔</span>Todavía no cargaste productos.<br>Agregalos desde la web en la compu.</div>';$('#products').querySelectorAll('button').forEach(b=>b.onclick=()=>openProduct(b.dataset.id))}
function openProduct(id){state.product=state.recetas.find(x=>x.id===id);if(!state.product)return;state.qty=1;state.selected=new Set();$('#sheet-name').textContent=state.product.nombre;$('#sheet-desc').textContent=state.product.desc||'';$('#extra-label').style.display=state.extras.length?'block':'none';$('#extras').innerHTML=state.extras.map(e=>`<button class="extra" data-id="${e.id}" type="button">${esc(e.nombre)} <em>+${fmt(e.precio)}</em></button>`).join('');$('#extras').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.selected.has(b.dataset.id)?state.selected.delete(b.dataset.id):state.selected.add(b.dataset.id);b.classList.toggle('on',state.selected.has(b.dataset.id));updateSheet()});updateSheet();$('#product-sheet').classList.add('open')}
function sheetUnit(){return Number(state.product?.precio)||0+[...state.selected].reduce((a,id)=>a+(Number(state.extras.find(x=>x.id===id)?.precio)||0),0)}
function updateSheet(){$('#qty').textContent=state.qty;const unit=(Number(state.product?.precio)||0)+[...state.selected].reduce((a,id)=>a+(Number(state.extras.find(x=>x.id===id)?.precio)||0),0);$('#add-product').textContent=`Agregar · ${fmt(unit*state.qty)}`}
$('#qty-less').onclick=()=>{state.qty=Math.max(1,state.qty-1);updateSheet()};$('#qty-more').onclick=()=>{state.qty++;updateSheet()};$('#add-product').onclick=()=>{const extras=[...state.selected].map(id=>state.extras.find(x=>x.id===id)).filter(Boolean);const unit=(Number(state.product.precio)||0)+extras.reduce((a,x)=>a+(Number(x.precio)||0),0);state.cart.push({burger:state.product.nombre,qty:state.qty,extras:extras.map(x=>x.nombre),subtotal:unit*state.qty});$('#product-sheet').classList.remove('open');renderCartBar();toast(`✓ ${state.qty}x ${state.product.nombre} agregado`)};
$('#product-sheet').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.classList.remove('open')};
function cartTotal(){return state.cart.reduce((a,x)=>a+(Number(x.subtotal)||0),0)}function renderCartBar(){const bar=$('#cartbar'),count=state.cart.reduce((a,x)=>a+x.qty,0);bar.classList.toggle('show',!!state.cart.length);$('#cart-count').textContent=`${count} ${count===1?'ítem':'ítems'}`;$('#cart-total').textContent=`${fmt(cartTotal())} ›`}
function openCart(){renderCartLines();renderPayments();$('#cart-screen').classList.add('open')}$('#cartbar').onclick=openCart;
function renderCartLines(){$('#cart-lines').innerHTML=state.cart.length?state.cart.map((x,i)=>`<div class="line"><div class="line-info"><div class="line-name">${esc(x.burger)}</div>${x.extras?.length?`<div class="line-extras">${x.extras.map(esc).join(', ')}</div>`:''}<div class="mini-step"><button class="mini" data-i="${i}" data-d="-1" type="button">−</button><span>${x.qty}</span><button class="mini" data-i="${i}" data-d="1" type="button">+</button></div></div><div class="line-side"><div class="price">${fmt(x.subtotal)}</div><button class="remove" data-remove="${i}" type="button">✕</button></div></div>`).join(''):'<div class="empty">Carrito vacío</div>';$('#checkout-total').textContent=fmt(cartTotal());$('#cart-lines').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const x=state.cart[+b.dataset.i],unit=x.subtotal/x.qty;x.qty=Math.max(1,x.qty+ +b.dataset.d);x.subtotal=unit*x.qty;renderCartLines();renderCartBar()});$('#cart-lines').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{state.cart.splice(+b.dataset.remove,1);renderCartLines();renderCartBar();if(!state.cart.length)$('#cart-screen').classList.remove('open')})}
function renderPayments(){const opts=['Efectivo','Transferencia','Débito','Crédito'];$('#payments').innerHTML=opts.map(x=>`<button class="pay ${x===state.pay?'on':''}" data-pay="${x}" type="button">${x}</button>`).join('');$('#payments').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.pay=b.dataset.pay;renderPayments()})}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===`view-${b.dataset.view}`))});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#'+b.dataset.close).classList.remove('open'));
async function changeStock(items,factor){for(const item of items||[]){const recipe=state.recetas.find(x=>x.nombre===item.burger);const lines=[...(recipe?.ing||'').split(',').filter(Boolean),...(item.extras||[]).map(n=>state.extras.find(x=>x.nombre===n)?.ing).filter(Boolean)];for(const line of lines){const p=line.split(':');if(p.length<2)continue;const stock=state.stock.find(x=>normal(x.nombre)===normal(p[0]));if(!stock)continue;let amount=(parseFloat(p[1])||0)*item.qty,unit=normal(p[2]),stockUnit=normal(stock.unidad);if((unit==='g'||unit==='gr')&&stockUnit==='kg')amount/=1000;if((unit==='ml'||unit==='cc')&&stockUnit==='l')amount/=1000;const value=factor>0?Number(stock.cantidad)+amount:Math.max(0,Number(stock.cantidad)-amount);await updateDoc(doc(dbx,'stock',stock.id),{cantidad:Math.round(value*1000)/1000})}}}
$('#confirm-order').onclick=async()=>{const customer=$('#customer').value.trim(),address=$('#address').value.trim(),notes=$('#notes').value.trim();if(!customer)return toast('⚠ Ingresá el nombre del cliente');if(!state.cart.length)return toast('⚠ El carrito está vacío');const btn=$('#confirm-order');btn.disabled=true;btn.textContent='Guardando…';const createdAt=Date.now(),sale={fecha:today(),hora:new Date(createdAt).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}),cliente:customer,direccion:address,items:state.cart.map(x=>({...x,extras:[...x.extras]})),total:cartTotal(),pago:state.pay,notas:notes,creadoEn:createdAt};try{const ref=await addDoc(collection(dbx,'ventas'),sale);await changeStock(sale.items,-1);state.lastId=ref.id;$('#cart-screen').classList.remove('open');$('#confirmed-customer').textContent=customer;$('#confirmed-total').textContent=fmt(sale.total);$('#confirmed-screen').classList.add('open');state.cart=[];state.pay='Efectivo';$('#customer').value='';$('#address').value='';$('#notes').value='';renderCartBar()}catch(err){console.error(err);toast('⚠ Error al guardar el pedido')}finally{btn.disabled=false;btn.textContent='✓ Confirmar pedido'}};
function renderOrders(){const a=state.ventas.filter(x=>x.fecha===today()).slice().reverse();$('#orders').innerHTML=a.length?a.map(v=>{const time=v.hora||(v.creadoEn?new Date(v.creadoEn).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}):'');return `<article class="order"><div class="order-top"><div><div class="order-client">${esc(v.cliente)}</div><div class="order-time">${time} · ${esc(v.pago)}</div></div><div class="order-total">${fmt(v.total)}</div></div><div class="order-items">${(v.items||[]).map(i=>`${i.qty}x ${esc(i.burger)}${i.extras?.length?` (${i.extras.map(esc).join(', ')})`:''}`).join('<br>')}</div>${v.direccion?`<div class="badge">📍 ${esc(v.direccion)}</div>`:''}${v.notas?`<div class="badge">📝 ${esc(v.notas)}</div>`:''}<div class="actions"><button class="print" data-print="${v.id}" type="button">🖨️ Imprimir 2 tickets</button><button class="danger" data-delete="${v.id}" type="button">✕</button></div></article>`}).join(''):'<div class="empty"><span class="emoji">📋</span>Todavía no hay pedidos hoy.</div>';$('#orders').querySelectorAll('[data-print]').forEach(b=>b.onclick=()=>printTicket(state.ventas.find(x=>x.id===b.dataset.print)));$('#orders').querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar este pedido? El stock se repone.'))return;const v=state.ventas.find(x=>x.id===b.dataset.delete);try{await changeStock(v.items,1);await deleteDoc(doc(dbx,'ventas',v.id));toast('✓ Pedido eliminado')}catch(e){console.error(e);toast('⚠ No se pudo eliminar el pedido')}})}
function renderSummary(){const a=state.ventas.filter(x=>x.fecha===today()),total=a.reduce((s,x)=>s+(Number(x.total)||0),0);$('#top-total').textContent=fmt(total);$('#sum-total').textContent=fmt(total);$('#sum-count').textContent=a.length;const counts={};a.forEach(v=>(v.items||[]).forEach(x=>counts[x.burger]=(counts[x.burger]||0)+x.qty));const top=Object.entries(counts).sort((a,b)=>b[1]-a[1])[0];$('#sum-top').textContent=top?`${top[0]} (${top[1]})`:'—';const low=state.stock.filter(x=>Number(x.cantidad)<=Number(x.minimo));$('#alerts').innerHTML=low.length?low.map(x=>`<div class="alert bad">⚠ <b>${esc(x.nombre)}</b>: quedan ${Math.round(x.cantidad*100)/100} ${esc(x.unidad)}</div>`).join(''):'<div class="alert ok">✓ Todo el stock en orden</div>'}
function waitForPrintRender() {
  return new Promise(resolve => {
    requestAnimationFrame(() => requestAnimationFrame(resolve));
  });
}

function wait(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

function ticketRows(v) {
  return (v.items || []).map(i => `
    <div style="padding:2.5mm 0;border-bottom:1px dotted #777">
      <b style="font-size:15px">${i.qty} x ${esc(i.burger)}</b>
      ${i.extras?.length
        ? `<div style="margin-top:1.5mm">+ EXTRAS: ${i.extras.map(esc).join(', ')}</div>`
        : ''}
    </div>
  `).join('');
}

function ticketHeader(v, copy, includeThankYou = false) {
  const hora = v.hora || (
    v.creadoEn
      ? new Date(v.creadoEn).toLocaleTimeString('es-AR', {
          hour: '2-digit',
          minute: '2-digit'
        })
      : ''
  );

  return `
    <div style="text-align:center;margin-bottom:4mm">
      <div style="font-size:26px;font-weight:bold">HANGAR 23</div>
      ${includeThankYou
        ? '<div style="font-size:12px;margin-top:1mm">Gracias por volar con nosotros</div>'
        : ''}
      <div style="font-weight:bold;margin-top:1mm">${copy}</div>
    </div>

    <div style="border-top:2px dashed #000;border-bottom:2px dashed #000;padding:2.5mm 0;margin-bottom:3mm">
      <div><b>ID:</b> ${esc(v.id.slice(-5).toUpperCase())}</div>
      <div><b>HORA:</b> ${esc(hora)}</div>
      <div><b>CLIENTE:</b> ${esc(v.cliente.toUpperCase())}</div>
    </div>
  `;
}

function deliveryTicket(v) {
  return `
    <section class="ticket">
      ${ticketHeader(v, 'COPIA DELIVERY', true)}
      ${ticketRows(v)}

      <div style="border:2px solid #000;padding:2.5mm;margin-top:4mm">
        <b>DIRECCIÓN:</b>
        <div style="margin-top:1.5mm;font-size:14px;font-weight:bold">
          ${esc((v.direccion || 'SIN DIRECCIÓN CARGADA').toUpperCase())}
        </div>
      </div>

      <div style="text-align:center;margin-top:6mm">--- DELIVERY ---</div>
    </section>
  `;
}

function kitchenTicket(v) {
  return `
    <section class="ticket">
      ${ticketHeader(v, 'COPIA COCINA')}
      ${ticketRows(v)}

      <div style="border:2px solid #000;padding:2.5mm;margin-top:4mm">
        <b>NOTAS:</b>
        <div style="margin-top:1.5mm;font-weight:bold">
          ${esc((v.notas || 'NINGUNA').toUpperCase())}
        </div>
      </div>

      <div style="text-align:center;margin-top:6mm">--- COCINA ---</div>
    </section>
  `;
}

async function printOneTicket(html) {
  $('#print-area').innerHTML = html;
  await waitForPrintRender();
  window.print();
}

async function printTicket(v) {
  if (!v) return;

  await printOneTicket(deliveryTicket(v));
  await wait(750);
  await printOneTicket(kitchenTicket(v));
}

$('#print-last').onclick = () => {
  printTicket(state.ventas.find(x => x.id === state.lastId));
};
  if(window.visualViewport){const update=()=>document.documentElement.style.setProperty('--app-h',`${window.visualViewport.height}px`);window.visualViewport.addEventListener('resize',update);window.visualViewport.addEventListener('scroll',update);update()}
</script>
</body>
